[project]
name = "forge-backend"
version = "0.1.0"
description = "Forge — AI-first learning platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "feedparser>=6.0.11",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "structlog>=24.1",
    "pgvector>=0.3",
    "tenacity>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",
    "ASYNC",
]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["forge"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["feedparser.*", "trafilatura.*", "celery.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "forge.workers.tasks.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres (FORGE_TEST_DATABASE_URL); skipped otherwise",
]
