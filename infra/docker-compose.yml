name: forge

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.api
    environment: &backend_env
      FORGE_DATABASE_URL: postgresql+asyncpg://forge:forge@postgres:5432/forge
      FORGE_REDIS_URL: redis://redis:6379/0
      FORGE_ANTHROPIC_API_KEY: ${FORGE_ANTHROPIC_API_KEY:-}
      FORGE_OPENAI_API_KEY: ${FORGE_OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.api
    command: celery -A forge.workers.celery_app worker -Q default,ingestion,enrichment,reviews,analytics -l info
    environment: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.api
    command: celery -A forge.workers.celery_app beat -l info
    environment: *backend_env
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
